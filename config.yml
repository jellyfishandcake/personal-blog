baseURL: "https://jellyfishandcake.github.io/"
title: "Julia | Portfolio"
theme: "PaperMod"

# This tells Hugo to handle Chinese and English properly
languageCode: zh-cn
defaultContentLanguage: zh

# Enable the Chinese font settings we added in extended.css
hasCJKLanguage: true 

params:
  env: production
  title: "Your Name"
  description: "Engineering Student & Skincare Enthusiast"
  author: "Your Name"
  
  # The "Home" configuration
  homeInfoParams:
    Title: "你好 👋"
    Content: "Welcome to my digital garden. I'm an engineering student documenting my projects and reflections here."

  # Social Icons (Great for CVs)
  socialIcons:
    - name: github
      url: "https://github.com/yourusername"
    - name: linkedin
      url: "https://linkedin.com/in/yourusername"

  # Minimalist settings for a clean look
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

# Navigation Menu
menu:
  main:
    - identifier: posts
      name: "Reflections"
      url: /posts/
      weight: 10
    - identifier: projects
      name: "Projects"
      url: /projects/
      weight: 20
    - identifier: cv
      name: "CV"
      url: /cv.pdf  # Link this to your PDF in the static folder later
      weight: 30
