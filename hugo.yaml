baseURL: "https://jellyfishandcake.github.io/personal-blog/"
title: "jellyfishandcake | personal-blog"
theme: ["github.com/adityatelange/hugo-PaperMod"]

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
hasCJKLanguage: true

languages:
  en:
    languageName: "English"
    weight: 1
    params:
      env: production
    menu:
      main:
        - identifier: about
          name: About
          url: /about/
          weight: 10
        - identifier: posts
          name: Posts
          url: /posts/
          weight: 20
        - identifier: cv
          name: CV
          url: "https://jellyfishandcake.github.io/personal-blog/cv.pdf"
          weight: 30

  zh:
    languageName: "中文 (Chinese)"
    weight: 2
    params:
      env: production
    menu:
      main:
        - identifier: about
          name: 关于
          url: /about/
          weight: 10
        - identifier: posts
          name: 文章
          url: /posts/
          weight: 20
        - identifier: cv
          name: 简历
          url: "https://jellyfishandcake.github.io/personal-blog/cv.pdf" # placeholder: swap to a Chinese CV once one exists
          weight: 30
