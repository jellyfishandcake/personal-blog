baseURL: "https://jellyfishandcake.github.io/"
title: "jellyfishandcake | personal-blog"
theme: ["github.com/adityatelange/hugo-PaperMod"]

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    params:
      env: production
      hasCJKLanguage: true
    menu:
      main:
        - identifier: about
          name: About
          url: /about/
          weight: 10
        - identifier: posts
          name: Posts
          url: /posts/
          weight: 20

  zh:
    languageName: "中文 (Chinese)"
    weight: 2
    params:
      env: production
      hasCJKLanguage: true
    menu:
      main:
        - identifier: about
          name: 关于
          url: /about/
          weight: 10
        - identifier: posts
          name: 文章
          url: /posts/
          weight: 20
